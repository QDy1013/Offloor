name: 候选版检查
on:
  pull_request:
  push:
    branches: ['codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 准备 Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.2.12479018' > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: ./.github/actions/checks
      - name: 端侧小模型推理库冒烟测试（电脑本机版 + 微型随机模型）
        run: |
          python3 -m pip install --quiet numpy==2.1.3
          python3 -I eval/smoke_local_llm.py
      - name: 构建独立测试包（含 arm64 推理库）
        run: |
          python3 android/build.py --sdk "$ANDROID_HOME" --preview --out "$RUNNER_TEMP/check-build" --require-native
          unzip -l "$RUNNER_TEMP/check-build/nopalou-preview.apk" | grep 'lib/arm64-v8a/liboffloor_llm.so'
      - uses: actions/upload-artifact@v4
        with:
          name: preview-apk
          path: ${{ runner.temp }}/check-build/nopalou-preview.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            ${{ runner.temp }}/core-checks.json
            ${{ runner.temp }}/browser-checks.json
            ${{ runner.temp }}/reliability-checks.json
            ${{ runner.temp }}/showcase.json
